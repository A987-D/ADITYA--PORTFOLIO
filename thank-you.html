<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Message Sent | Thank You</title>

  <style>
    body {
      margin: 0;
      font-family: "Poppins", sans-serif;
      background: #0f0f1a;
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      overflow: hidden;
    }

    /* background glow */
    .bg-glow {
      position: absolute;
      width: 400px;
      height: 400px;
      background: #25d366;
      filter: blur(120px);
      opacity: 0.2;
      border-radius: 50%;
      animation: float 6s ease-in-out infinite;
    }

    @keyframes float {
      0%,100% { transform: translateY(0px); }
      50% { transform: translateY(-30px); }
    }

    .card {
      text-align: center;
      padding: 40px;
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 20px;
      backdrop-filter: blur(10px);
      box-shadow: 0 10px 40px rgba(0,0,0,0.4);
      transform: scale(0.8);
      animation: pop 0.8s ease forwards;
    }

    @keyframes pop {
      to {
        transform: scale(1);
      }
    }

    .check {
      width: 80px;
      height: 80px;
      margin: auto;
      border-radius: 50%;
      background: #25d366;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 40px;
      animation: pulse 1.5s infinite;
    }

    @keyframes pulse {
      0% { box-shadow: 0 0 0 0 rgba(37,211,102,0.5); }
      70% { box-shadow: 0 0 0 20px rgba(37,211,102,0); }
      100% { box-shadow: 0 0 0 0 rgba(37,211,102,0); }
    }

    h1 {
      margin-top: 20px;
      font-size: 28px;
    }

    p {
      color: #bbb;
      margin-top: 10px;
    }

    .btn {
      margin-top: 25px;
      display: inline-block;
      padding: 12px 25px;
      background: #25d366;
      color: white;
      text-decoration: none;
      border-radius: 50px;
      transition: 0.3s;
    }

    .btn:hover {
      transform: scale(1.05);
      background: #1fb85a;
    }

  </style>
</head>

<body>

  <div class="bg-glow"></div>

  <div class="card">
    <div class="check">✓</div>

    <h1>Message Sent Successfully</h1>
    <p>Thanks for reaching out! I will get back to you within 24 hours.</p>

    <a href="index.html" class="btn">Back to Home</a>
  </div>

</body>
</html>
